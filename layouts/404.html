{{ define "main" }}

      <p class="font-ui text-6xl font-semibold text-primary mb-4">404</p>
      <h1 class="font-ui text-xl font-semibold text-on-surface mb-3">{{ T "error_404_title" }}</h1>
      <p class="text-on-surface-secondary mb-8">{{ T "error_404_description" }}</p>
