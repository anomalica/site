<footer class="border-t border-border dark:border-darkmode-border">
  <div class="container">
    <div class="flex items-center justify-between py-6">
      <!-- Logo -->
      <div>
        <a class="navbar-brand inline-block" href="{{ site.Home.RelPermalink }}">
          {{ partial "logo" }}
        </a>
      </div>

      <!-- Footer links -->
      <div class="flex items-center gap-6">
        {{ range site.Menus.footer }}
          <a
            class="text-sm font-primary text-text-light hover:text-text-dark dark:text-darkmode-text-light dark:hover:text-darkmode-text-dark"
            {{ if findRE `^http` .URL }}
              target="_blank" rel="noopener"
            {{ end }}
            href="{{ if findRE `^#` .URL }}
              {{ if not $.IsHome }}
                {{ site.Home.RelPermalink }}
              {{ end }}{{ .URL }}
            {{ else }}
              {{ .URL | relLangURL }}
            {{ end }}">{{ .Name }}</a>
        {{ end }}

        <!-- GitHub icon - subtle, no highlight -->
        <a href="https://github.com/anomalica"
          target="_blank"
          rel="noopener"
          aria-label="GitHub"
          class="text-text-light hover:text-text-dark dark:text-darkmode-text-light dark:hover:text-darkmode-text-dark">
          <i class="fab fa-github text-lg"></i>
        </a>
      </div>
    </div>

    <!-- Copyright -->
    <div class="border-t border-border dark:border-darkmode-border py-4">
      <p class="text-center text-xs text-text-light dark:text-darkmode-text-light font-primary">
        {{ site.Params.copyright | markdownify }}
      </p>
    </div>
  </div>
</footer>
