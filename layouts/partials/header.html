<header class="sticky top-0 z-30 bg-chrome backdrop-blur-sm" x-data="{ mobileOpen: false, unitsOpen: false, searchFocused: false }" @click.outside="unitsOpen = false">
  <nav class="mx-auto flex max-w-6xl items-center gap-4 px-6 py-2">
    <!-- Logo -->
    <a href="{{ site.Home.RelPermalink }}" class="flex-none">
      {{ with resources.Get "images/logo-darkmode.svg" }}
        <img src="{{ .RelPermalink }}" alt="{{ site.Title }}" class="h-4">
      {{ end }}
    </a>

    <!-- Search bar -->
    <div class="hidden lg:flex flex-1 max-w-md mx-auto">
      <div class="relative w-full" :class="searchFocused ? 'ring-1 ring-on-chrome-active/30 rounded' : ''">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-on-chrome-secondary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
        <input type="search" placeholder="Search records..." class="w-full rounded bg-on-chrome/10 py-1.5 pl-9 pr-3 text-sm font-ui text-on-chrome-active placeholder:text-on-chrome-secondary/50 outline-none transition-colors focus:bg-on-chrome/15" @focus="searchFocused = true" @blur="searchFocused = false" disabled title="Search coming soon">
      </div>
    </div>

    <!-- Right controls -->
    <div class="flex items-center gap-1 flex-none">
      <!-- Mobile search icon -->
      <button class="lg:hidden rounded p-2 text-on-chrome hover:text-on-chrome-active transition-colors cursor-pointer" aria-label="Search" disabled title="Search coming soon">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      </button>

      <!-- Language selector (opens modal) -->
      <button @click="langModalOpen = true" class="flex items-center gap-1 rounded px-2 py-1 text-sm font-ui text-on-chrome hover:text-on-chrome-active transition-colors cursor-pointer">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/></svg>
        <span class="hidden md:inline">EN</span>
      </button>

      <!-- Units selector -->
      <div class="relative hidden md:block">
        <button @click="unitsOpen = !unitsOpen" class="flex items-center gap-1 rounded px-2 py-1 text-xs font-ui font-semibold text-on-chrome hover:text-on-chrome-active transition-colors cursor-pointer">
          <span class="rounded bg-on-chrome/15 px-1.5 py-0.5">m</span>
          <svg class="h-3 w-3 fill-current" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
        </button>
        <div x-show="unitsOpen" x-transition class="absolute right-0 mt-1 w-36 rounded bg-surface-raised border border-border py-1 shadow-lg z-50">
          <a href="#" class="block px-4 py-1.5 text-sm text-primary font-medium" data-unit="metric">Metric</a>
          <a href="#" class="block px-4 py-1.5 text-sm text-on-surface-secondary hover:text-primary" data-unit="imperial">Imperial</a>
        </div>
      </div>

      <!-- Dark mode toggle -->
      <button @click="darkMode = !darkMode" class="rounded p-2 text-on-chrome hover:text-on-chrome-active transition-colors cursor-pointer" aria-label="Toggle dark mode">
        <svg x-show="darkMode" class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
        <svg x-show="!darkMode" class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>

      <!-- Mobile hamburger -->
      <button @click="mobileOpen = !mobileOpen" class="lg:hidden rounded p-2 text-on-chrome hover:text-on-chrome-active transition-colors cursor-pointer" aria-label="Menu">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path x-show="!mobileOpen" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
          <path x-show="mobileOpen" stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div x-show="mobileOpen" x-transition class="lg:hidden border-t border-border px-6 py-4">
    <ul class="space-y-3 font-ui text-sm">
      {{ range (slice "People" "Organisations" "Places" "Events" "Matters" "Objects") }}
        <li><a href="/{{ . | urlize }}/" class="text-on-chrome hover:text-on-chrome-active">{{ . }}</a></li>
      {{ end }}
    </ul>
  </div>
</header>
