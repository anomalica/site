baseURL = "/"
title = "Anomalica"
timeZone = "UTC"
hasCJKLanguage = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

# Reviewer-vs-public build gate. Default false = public-safe (no workbench
# links). True under `hugo server` (local reviewer preview) via hugo.IsServer,
# or set here / per-environment for a deployed reviewer preview.
[params]
reviewerPreview = false
# Reviewer tooling (workbench app) entry point - local dev for now.
workbenchUrl = "http://localhost:5173"

[languages.en]
languageName = "English"
languageCode = "en-GB"
weight = 1

[languages.en-US]
languageName = "English (US)"
languageCode = "en-US"
weight = 2

