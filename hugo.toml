baseURL = "https://anomalica.is"
title = "Anomalica"
timeZone = "UTC"
hasCJKLanguage = true
# Assembler/workbench drop presentation-directive inputs alongside content
# (foo.directives.yaml, _directives.yaml, _directives.<lang>.yaml). They are build
# inputs, not pages: Hugo otherwise copies the language-coded ones verbatim into
# public/ and serves them at their literal URL. Exclude them from the content walk.
ignoreFiles = ['directives(\.[A-Za-z-]+)?\.ya?ml$']
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
# Serve from disk wipes orphans: removed/renamed pages 404 honestly instead of
# lingering in public/ as phantom 200s (this Hugo serves public/ from disk).
cleanDestinationDir = true
# Launch scope: English only. The other 29 languages have no translated content
# yet, so building them produces empty shells whose nav dead-links. Disable them
# until the translate pipeline produces each one's content, then drop it from
# this list. The language picker still showcases all 30 (disabled "coming" tiles)
# from data/languages.json.
disableLanguages = ["ar","bn","de","en-us","es","fa","fr","hi","id","it","ja","ko","mr","my","pl","pt","ru","sw","ta","te","th","tl","tr","uk","ur","uz","vi","zh","zh-hant"]

[params]
# Workbench app entry point (prod host; resolves after the apex DNS flip).
workbenchUrl = "https://workbench.anomalica.is"
# Cloudflare Turnstile public site key for the contact form (managed mode,
# domain anomalica.is). Public by design; the secret lives on the edge script.
turnstileSiteKey = "0x4AAAAAADpGTmvDDkyVDZ29"
# Contact form gate. OFF until the Resend key + send.anomalica.is DNS are live
# AND the privacy policy names Cloudflare Turnstile + Resend. While off, the
# contact page shows only the GitHub routes and loads no Turnstile third-party.
contactFormEnabled = true

# Public contact email shown on the contact page. Must be an address that
# actually receives mail (apex MX is on Proton).
contactEmail = "hello@anomalica.is"

