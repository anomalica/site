[pagination]
pagerSize = 20

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = "assets/notwatching/hugo_stats\\.json"
target = "css"

[module]
[[module.mounts]]
source = "content/english"
target = "content"

[[module.mounts]]
source = "../content/pages"
target = "content"

[[module.mounts]]
source = "../content/legal"
target = "content/legal"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
disableWatch = true
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"

# Mounting a file into data/ replaces Hugo's default data mount, so the project's
# own data/ must be re-declared explicitly alongside it.
[[module.mounts]]
source = "data"
target = "data"

# Canonical single-source files owned by the meta-repo, mounted (not copied) so
# the architecture page renders from the one authoritative copy; never hand-maintain
# a second copy here. format-specs feeds the node front-matter panels; architecture
# feeds the node detail panels. (pipeline.svg is rendered offline from the meta-repo's
# reference/pipeline.mmd - see assets/architecture/README.md.)
[[module.mounts]]
source = "../anomalica/reference/format-specs.yaml"
target = "data/format_specs.yaml"

[[module.mounts]]
source = "../anomalica/reference/architecture.yaml"
target = "data/architecture.yaml"

# The model policy is the source of truth for what the pipeline may dispatch,
# and the public page is generated from it so the two cannot disagree.
[[module.mounts]]
source = "../anomalica/architecture/model-policy.yaml"
target = "data/model_policy.yaml"

[outputs]
# JSON on the home page is the site-wide search index (layouts/index.json).
home = ["HTML", "RSS", "JSON"]

[server]
[[server.redirects]]
from = "/**"
to = "/en/404.html"
status = 404

[imaging]
quality = 80

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "monokai"
