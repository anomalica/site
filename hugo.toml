[pagination]
pagerSize = 20

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = "assets/notwatching/hugo_stats\\.json"
target = "css"

[module]
[[module.mounts]]
source = "content/english"
target = "content"

[[module.mounts]]
source = "../content/pages"
target = "content"

[[module.mounts]]
source = "../content/legal"
target = "content/legal"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
disableWatch = true
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"

[outputs]
home = ["HTML", "RSS"]

[server]
[[server.redirects]]
from = "/**"
to = "/en/404.html"
status = 404

[imaging]
quality = 80

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "monokai"
