# INTERIM, site-authored - transcribed from the meta-repo's canonical format docs
# (anomalica/architecture/record-format.md, digest-format.md, brief-format.md).
# The canonical single source will be the meta-repo's structured reference/format-specs.yaml;
# when that lands this file is REPLACED by a mount of it (delete it then).
# Field names, types and required flags are copied verbatim from those docs. The per-type
# `formats` tag is set ONLY where a doc explicitly names a handler/source type; left unset
# (applies to all types) otherwise rather than guessed. Content (assembler output) is
# omitted until content-format.md exists.

ingest:
  summary: "One markdown + YAML record per source, content-addressed by hash. Some fields apply only to particular source
    types (pdf/audio/video/web/ebook)."
  fields:
    - {name: schema, type: string, required: true, description: "Record format version. Always anomalica/record/1."}
    - {name: title, type: string, required: true, description: "Document or episode title."}
    - {name: date_published, type: "string | null", required: true, description: "When the original content was published
        (ISO 8601; null when the source is genuinely undated - never fabricated)."}
    - {name: source_type, type: enum, required: true, description: "One of pdf, audio, video, web, ebook."}
    - {name: content_hash, type: sha256, required: false, description: "Names the record's file in store/. Hashes the source
        bytes for pdf/audio/video, the extracted body text for web/ebook."}
    - {name: source_hash, type: sha256, required: false, description: "SHA-256 of the raw source asset (post-render HTML or
        EPUB bytes), locating sources/{source_hash}.{ext}.", formats: [web, ebook]}
    - {name: publisher, type: string, required: false, description: "The entity that created the content (not the hosting
        platform)."}
    - {name: creators, type: list, required: false, description: "The human creator(s) - author(s), host(s)/presenter(s).
        'Last, First Middle' preferred."}
    - {name: source_url, type: url, required: false, description: "URL where the source can be found."}
    - {name: source_id, type: string, required: false, description: "Stable platform-specific identifier (e.g. youtube:ZBtMbBPzqHY)."}
    - {name: fetched_url, type: url, required: false, description: "URL actually retrieved from, if different from source_url
        (e.g. a Wayback Machine archive)."}
    - {name: source_file, type: string, required: false, description: "Original filename for a record ingested from a local
        file with no URL."}
    - {name: provenance, type: string, required: false, description: "Set to 'unknown' when a record has no recoverable acquisition
        origin."}
    - {name: pages, type: integer, required: false, description: "Page count, for documents."}
    - {name: duration, type: number, required: false, description: "Run-time in seconds.", formats: [audio, video]}
    - {name: snapshots, type: list, required: false, description: "Sibling capture artefacts (page-render PDF, frozen page),
        each with role, hash and content_type.", formats: [web]}
    - {name: classification, type: string, required: false, description: "Original security-classification banner of the source,
        verbatim (e.g. SECRET//REL TO USA, FVEY)."}
    - {name: date_accessed, type: datetime, required: false, description: "When the source was fetched (ISO 8601, Zulu)."}
    - {name: date_extracted, type: datetime, required: false, description: "When the ingestion pipeline ran (ISO 8601, Zulu)."}
    - {name: copyright, type: object, required: false, description: "Copyright status and access gate for the record."}
    - {name: processing, type: object, required: false, description: "Processing metadata: handler, version, tools used, source
        characteristics."}
    - {name: media, type: object, required: false, description: "Summary of extracted media stored at media/{record_hash}/
        (count, total_bytes)."}
    - {name: ai_usage, type: list, required: false, description: "Per-stage AI usage (provenance): model/version and token
        counts; local stages record wall-time instead.",}

digest:
  summary: "Per-record digest: the nodes and claims AI extracted from one source, with provenance."
  fields:
    - {name: schema, type: string, required: true, description: "Always anomalica/digest/1."}
    - {name: extracted_at, type: datetime, required: true, description: "When extraction ran (ISO 8601)."}
    - {name: model, type: string, required: true, description: "AI model used for extraction."}
    - {name: record, type: object, required: true, description: "The source record this digest came from: id, title, producer,
        date, reference."}
    - {name: nodes, type: list, required: true, description: "Extracted entities (id, type, name)."}
    - {name: domain_claims, type: list, required: true, description: "Extracted factual claims, each with type, attestation,
        speaker, location, date, refs, verbatim quote and canonical text."}
    - {name: infrastructure_claims, type: list, required: false, description: "Pipeline/infrastructure claims; absent when
        there are none."}
    - {name: ai_usage, type: list, required: false, description: "Per-stage AI usage carried forward (ingest -> digest): model/version
        and token counts.",}

brief:
  summary: "A language-neutral slice of the knowledge graph a single page is written from, before any prose."
  fields:
    - {name: schema, type: string, required: true, description: "Always anomalica/brief/1."}
    - {name: brief_hash, type: sha256, required: true, description: "Fingerprint over the ordered claims plus page identity;
        the staleness, freeze and audit unit."}
    - {name: page, type: object, required: true, description: "The page this brief builds: kind, node_id, node_type, title,
        slug."}
    - {name: generated, type: object, required: false, description: "graph_version - the knowledge-graph version the brief
        was generated from."}
    - {name: related_nodes, type: list, required: false, description: "Nodes co-occurring with the page entity, ranked by
        shared-claim count, each with a resolved slug for cross-links."}
    - {name: claims, type: list, required: true, description: "The ordered selection of claims the writer may use - each with
        content, original_excerpt, claim_type, attestation, speaker, node_refs, date, location_in_record, evidence and provenance."}
