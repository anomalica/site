# Retired URLs, kept working.
#
# A page that is merged away or renamed leaves its URL behind: links from other
# sites, search results and anyone's bookmarks still point at it. The assembler
# generates aliases from an entity's own naming history, which covers renames -
# but not a page merged into a DIFFERENT entity, because the surviving node
# never carried that slug. This file is that gap.
#
# It lives here rather than in content front matter because front matter is
# regenerated on every write: hand-added aliases have been destroyed by a
# rebuild before.
#
# Applied at deploy time, after the build. A redirect is SKIPPED while a real
# page still occupies its path, so an entry can be added before the page is
# removed and takes effect on its own once the page goes. The deploy refuses to
# delete a page that has no entry here, so the order cannot be got wrong.
#
# NOTE THE QUOTED STRINGS. A folded scalar (>-) followed by a blank line gets
# "#magic___^_^___line" written INTO the string by the yamlfmt commit hook
# (retain_line_breaks: true). It is how yamlfmt remembers the blank line, and it
# does not survive as a comment. Keep notes on one quoted line.

