objects: "பொருட்கள்"
objects_desc: "பெயரிடப்பட்ட இயற்பியல் பொருட்கள் மற்றும் தொல்பொருட்கள்"
principle_source_title: "ஆதாரம்-சுட்டப்பட்டது"
principle_source_desc: "ஒவ்வொரு கூற்றும் குறிப்பிட்ட மூல ஆவணம், பக்கம் மற்றும் பத்திக்கு கண்டறியப்படலாம்."
principle_scored_title: "அல்காரிதம் மதிப்பீடு"
principle_scored_desc: "சான்றின் வலிமை சான்றளிப்பு நிலை, உறுதிப்படுத்தல் மற்றும் மூல சுதந்திரம் ஆகியவற்றிலிருந்து கணக்கிடப்படுகிறது."
principle_jurisdiction_title: "அதிகார வரம்பு-சுதந்திரம்"
principle_jurisdiction_desc: "எந்த தேசிய நலனுடனும் இணைக்கப்படவில்லை. பல அதிகார வரம்புகளில் வழங்கப்படுகிறது."
principle_open_title: "திறந்த தரவு"
principle_open_desc: "CC0 பொது உரிமை உள்ளடக்கம். பதிவிறக்கக்கூடிய SQLite அறிவுக் கிராஃப். MIT உரிமம் பெற்ற குறியீடு."
principle_ai_title: "வெளிப்படையான AI"
principle_ai_desc: "AI தகவல்களை ஒழுங்கமைக்கிறது ஆனால் கூற்றுகளை உருவாக்காது. சுதந்திர மாதிரிகள் தொகுப்பை சரிபார்க்கின்றன."
principle_multilingual_title: "பன்மொழி"
principle_multilingual_desc: "உலக எழுத்தறிவு மக்கள்தொகையில் 77% உள்ளடக்கும் 30 மொழிகள்."
status_early: "Anomalica ஆரம்ப வளர்ச்சியில் உள்ளது. தொகுப்புக் குழாய் இயங்கத் தொடங்கும்போது உள்ளடக்கம் தோன்றும்."
browse_by_type: "வகையின்படி உலாவுக"
search_not_available: "தேடல் இன்னும் கிடைக்கவில்லை. மேலே உள்ள வகைகளை உலாவுக அல்லது பகுதி பக்கங்களைப் பயன்படுத்துக."
